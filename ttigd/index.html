<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Ketersediaan Tempat Tidur &amp; IGD - RSUASF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --dark-brown: #3e2723;
        --gold: #d4af37;
        --light-bg: #fdfaf5;
        --green-success: #2e7d32;
        --red-danger: #c62828;
      }

      * { box-sizing: border-box; }

      body { 
        background-color: var(--light-bg); 
        color: var(--dark-brown);
        font-family: 'Lato', sans-serif;
        height: 100vh;
        overflow: hidden;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      /* Header Layout */
      .header {
        background: var(--dark-brown);
        color: var(--gold);
        padding: 12px 30px;
        border-bottom: 5px solid var(--gold);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
        height: 96px;
      }

      .brand-section h1 { 
        font-weight: 900; 
        font-size: 2rem; 
        margin: 0; 
        letter-spacing: 1px; 
        line-height: 1.1;
      }
      .brand-section .sub-title { 
        font-size: 1.15rem; 
        color: #fff; 
        opacity: 0.9; 
        font-weight: 700;
        margin-top: 2px;
      }
      
      #current-date { 
        font-size: 0.95rem; 
        font-weight: 700; 
        color: var(--gold); 
        text-transform: uppercase; 
        letter-spacing: 0.5px;
      }
      #current-time { 
        font-size: 2.6rem; 
        font-weight: 900; 
        color: var(--gold); 
        line-height: 1; 
      }

      /* Layout Split 50:50 */
      .page-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px;
        flex: 1;
        overflow: hidden;
        min-height: 0;
      }

      /* SISI KIRI (50%): RAWAT INAP REGULER */
      .main-container { 
        display: grid;
        grid-template-columns: 175px 1fr;
        gap: 10px;
        overflow: hidden;
        min-height: 0;
      }

      .sidebar-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .bor-card {
        background: var(--dark-brown);
        color: white;
        border-radius: 12px;
        padding: 12px 8px;
        text-align: center;
        border-bottom: 5px solid var(--gold);
        box-shadow: 0 4px 10px rgba(62, 39, 35, 0.08);
      }
      .bor-value {
        font-size: 2.3rem;
        font-weight: 900;
        color: var(--gold);
        line-height: 1;
        margin: 3px 0;
      }
      .bor-label { font-size: 0.72rem; font-weight: 700; color: #ccc; letter-spacing: 0.5px; }

      .summary-indicator-card {
        background: white;
        border-radius: 12px;
        padding: 10px 8px;
        box-shadow: 0 4px 10px rgba(62, 39, 35, 0.04);
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      .indicator-item {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 8px 4px;
        border-radius: 10px;
        font-weight: 900;
        font-size: 0.75rem;
        flex: 1;
        gap: 4px;
      }
      .indicator-item.available { background: rgba(46, 125, 50, 0.08); color: var(--green-success); }
      .indicator-item.occupied { background: rgba(198, 40, 40, 0.08); color: var(--red-danger); }
      
      .indicator-val { 
        font-size: 2.2rem; 
        line-height: 1;
        font-weight: 900;
      }

      .content-panel {
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(62, 39, 35, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-top: 5px solid var(--gold);
        min-height: 0;
      }

      .tabs-header {
        background: var(--dark-brown);
        display: flex;
        flex-wrap: wrap;
        border-bottom: 3px solid var(--gold);
      }

      .tab-btn {
        flex: 1;
        min-width: 65px;
        padding: 8px 3px;
        background: transparent;
        border: none;
        color: white;
        font-weight: 900;
        font-size: 0.72rem;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .tab-btn span { font-size: 0.65rem; font-weight: 400; opacity: 0.8; }
      .tab-btn.active {
        background: var(--gold);
        color: var(--dark-brown);
      }
      .tab-btn.active span { color: var(--dark-brown); font-weight: 700; }

      .tab-content-wrapper {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .tab-pane {
        display: none;
        flex: 1;
        min-height: 0;
      }
      .tab-pane.active {
        display: flex;
        flex-direction: column;
      }

      .bangsal-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        flex: 1;
        align-content: stretch;
      }

      .bangsal-card {
        background: #faf7f2;
        border-radius: 10px;
        border-left: 5px solid var(--gold);
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .bangsal-header {
        background: #f1ebd9;
        padding: 6px 10px;
        font-weight: 900;
        font-size: 0.92rem;
        color: var(--dark-brown);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
      }
      .bangsal-class {
        font-size: 0.68rem;
        background: var(--dark-brown);
        color: var(--gold);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .bangsal-body {
        padding: 8px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex: 1;
      }

      .stat-mini-box { text-align: center; flex: 1; }
      .stat-mini-box .val { font-size: 1.6rem; font-weight: 900; line-height: 1; }
      .stat-mini-box .lbl { font-size: 0.7rem; font-weight: 700; color: #777; margin-top: 3px; text-transform: uppercase; }
      
      .stat-mini-box.total .val { color: var(--dark-brown); }
      .stat-mini-box.avail .val { color: var(--green-success); }
      .stat-mini-box.occu .val { color: var(--red-danger); }

      .divider-line { width: 1px; height: 30px; background: #ddd; }
      .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; flex: 1; font-size: 1.1rem; font-weight: 900; color: #ccc; }

      /* SISI KANAN (50%): PANEL KHUSUS IGD DENGAN HEADER JUMBO */
      .igd-panel {
        background: white;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(62, 39, 35, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-top: 5px solid var(--red-danger);
        min-height: 0;
      }

      /* Header IGD Baru: Aksen Merah Medis, Lebih Luas & Sangat Kontras */
      .igd-top-bar {
        background: linear-gradient(135deg, #b71c1c 0%, #880e4f 100%);
        padding: 12px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #ff5252;
        flex-shrink: 0;
        box-shadow: 0 3px 8px rgba(0,0,0,0.12);
      }
      .igd-title-wrap {
        display: flex;
        flex-direction: column;
      }
      .igd-title-wrap .title {
        font-weight: 900;
        font-size: 1.25rem;
        color: #fff;
        letter-spacing: 0.8px;
        line-height: 1.1;
      }
      .igd-title-wrap .sub {
        font-size: 0.75rem;
        color: #ffcdd2;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-top: 3px;
      }
      
      /* Badges Counter IGD: Jumbo, Tegas, & Jelas Terbaca */
      .igd-counter-badges {
        display: flex;
        gap: 12px;
      }
      .counter-badge {
        padding: 6px 14px;
        border-radius: 10px;
        font-weight: 900;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      }
      .counter-badge.avail {
        background: #ffffff;
        color: var(--green-success);
        border: 2px solid #a5d6a7;
      }
      .counter-badge.occu {
        background: #ffffff;
        color: var(--red-danger);
        border: 2px solid #ffcdd2;
      }
      .counter-badge-val {
        font-size: 1.6rem;
        line-height: 1;
        font-weight: 900;
      }

      /* Grid Presisi 3 Kolom x 3 Baris Menghabiskan Area */
      .igd-grid-wrapper {
        flex: 1;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 10px;
        min-height: 0;
      }

      .igd-bed-card {
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 8px 10px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.03);
        border: 2px solid transparent;
        position: relative;
        overflow: hidden;
      }

      .igd-bed-card.available {
        background: #f0fdf4;
        border-color: #bbf7d0;
      }
      .igd-bed-card.occupied {
        background: #fef2f2;
        border-color: #fecaca;
      }

      .bed-top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .bed-class-sub {
        font-size: 0.75rem;
        font-weight: 700;
        color: #555;
        background: rgba(0,0,0,0.05);
        padding: 2px 7px;
        border-radius: 5px;
      }

      .bed-status-pill {
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 900;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .igd-bed-card.available .bed-status-pill {
        background: var(--green-success);
        color: #fff;
      }
      .igd-bed-card.occupied .bed-status-pill {
        background: var(--red-danger);
        color: #fff;
      }

      /* Area Tengah: Ikon Bed & Label Nomor Bed */
      .bed-center-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 2px 0;
      }

      .bed-main-icon {
        font-size: 2.3rem;
        line-height: 1;
        opacity: 0.85;
      }
      .igd-bed-card.available .bed-main-icon { color: var(--green-success); }
      .igd-bed-card.occupied .bed-main-icon { color: var(--red-danger); }

      .bed-label-title {
        font-weight: 900;
        font-size: 1.85rem;
        line-height: 1.1;
        letter-spacing: 0.5px;
      }
      .igd-bed-card.available .bed-label-title { color: #166534; }
      .igd-bed-card.occupied .bed-label-title { color: #991b1b; }

      .fade-in { animation: fadeIn 0.3s ease-in; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      @media (max-width: 992px) {
        .page-wrapper {
          grid-template-columns: 1fr;
          overflow-y: auto;
        }
        body { height: auto; overflow: auto; }
        .igd-grid-wrapper { min-height: 480px; }
      }
    </style>
  </head>
  <body>

    <div class="header">
      <div class="brand-section">
        <h1>KETERSEDIAAN TEMPAT TIDUR</h1>
        <div class="sub-title">RS AISYIYAH SITI FATIMAH</div>
      </div>
      <div class="text-center text-md-end">
        <div id="current-date">-</div>
        <div id="current-time">00:00:00</div>
      </div>
    </div>

    <div class="page-wrapper">
      <!-- SISI KIRI (50%): RAWAT INAP REGULER -->
      <div class="main-container">
        <div class="sidebar-panel">
          <div class="bor-card">
            <div class="bor-label">BOR REALTIME RANAP</div>
            <div class="bor-value"><span id="bor-total">0</span>%</div>
            <div class="bor-label">EXCL. IGD &amp; VK</div>
          </div>

          <div class="summary-indicator-card">
            <div class="indicator-item available">
              <div>BED RANAP TERSEDIA</div>
              <div class="indicator-val" id="total-available">0</div>
            </div>
            <div class="indicator-item occupied">
              <div>BED RANAP TERISI</div>
              <div class="indicator-val" id="total-occupied">0</div>
            </div>
          </div>
        </div>

        <div class="content-panel">
          <div class="tabs-header">
            <button class="tab-btn active" id="tab-irna1" onclick="switchTab('irna1')">
              IRNA 1
              <span>Tersedia: <strong id="irna1-available-icon">0</strong></span>
            </button>
            <button class="tab-btn" id="tab-irna2" onclick="switchTab('irna2')">
              IRNA 2
              <span>Tersedia: <strong id="irna2-available-icon">0</strong></span>
            </button>
            <button class="tab-btn" id="tab-icu" onclick="switchTab('icu')">
              ICU / INTENSIF
              <span>Tersedia: <strong id="icu-available-icon">0</strong></span>
            </button>
            <button class="tab-btn" id="tab-bersalin" onclick="switchTab('bersalin')">
              KEBIDANAN
              <span>Tersedia: <strong id="bersalin-available-icon">0</strong></span>
            </button>
            <button class="tab-btn" id="tab-bayi" onclick="switchTab('bayi')">
              PERINATOLOGI
              <span>Tersedia: <strong id="bayi-available-icon">0</strong></span>
            </button>
          </div>

          <div class="tab-content-wrapper">
            <div id="irna1-container" class="tab-pane active fade-in">
              <div class="text-center p-4 text-muted">Memuat data...</div>
            </div>
            <div id="irna2-container" class="tab-pane fade-in"></div>
            <div id="icu-container" class="tab-pane fade-in"></div>
            <div id="bersalin-container" class="tab-pane fade-in"></div>
            <div id="bayi-container" class="tab-pane fade-in"></div>
          </div>
        </div>
      </div>

      <!-- SISI KANAN (50%): PANEL KHUSUS IGD DENGAN GRID 3X3 -->
      <div class="igd-panel">
        <div class="igd-top-bar">
          <div class="igd-title-wrap">
            <div class="title">INSTALASI GAWAT DARURAT (IGD)</div>
            <div class="sub">OBSERVASI &amp; TINDAKAN MEDIS</div>
          </div>
          <div class="igd-counter-badges">
            <div class="counter-badge avail">
              <span>TERSEDIA</span>
              <span class="counter-badge-val" id="igd-total-available">0</span>
            </div>
            <div class="counter-badge occu">
              <span>TERISI</span>
              <span class="counter-badge-val" id="igd-total-occupied">0</span>
            </div>
          </div>
        </div>

        <div class="igd-grid-wrapper" id="igd-list">
          <div class="text-center p-3 text-muted" style="grid-column: 1 / -1;">Memuat bed IGD...</div>
        </div>
      </div>
    </div>

    <script>
      const nursingStations = {
        irna1: ['AHMAD DAHLAN', 'NUSAIBAT', 'RUFAIDAH', 'ZAHRAH', 'IBNU NAFIS', 'IBNU SINA', 'USMAN', 'WALIDAH'],
        irna2: ['ABU BAKAR', 'AISYAH', 'SALWA', 'AQOBAH 1', 'AQOBAH 2', 'UMAR'],
        icu: ['ICU'],
        bersalin: ['MARWAH', 'KHODIJAH', 'SHAFA'],
        bayi: ['AROFAH Kelas 3', 'AROFAH Kelas 2', 'AROFAH Kelas 1']
      };

      const sectionKeys = ['irna1', 'irna2', 'icu', 'bersalin', 'bayi'];
      let activeTabIndex = 0;

      // Status helper
      const isAvailable = (bed) => bed.status === 'KOSONG' || bed.status === 'DIBOOKING';
      const isOccupied = (bed) => bed.status === 'ISI';

      function isIgdUnit(bed) {
        const bangsalName = (bed.nm_bangsal || '').toUpperCase().trim();
        const kamarCode = (bed.kd_kamar || '').toUpperCase().trim();
        return bangsalName.includes('IGD') || kamarCode.startsWith('IGD');
      }

      function isVkUnit(bed) {
        const bangsalName = (bed.nm_bangsal || '').toUpperCase().trim();
        const kamarCode = (bed.kd_kamar || '').toUpperCase().trim();
        return bangsalName.includes('VK') || bangsalName.includes('BERSALIN') || kamarCode.startsWith('VK');
      }

      function switchTab(sectionId) {
        sectionKeys.forEach(key => {
          document.getElementById(`tab-${key}`).classList.remove('active');
          document.getElementById(`${key}-container`).classList.remove('active');
        });
        document.getElementById(`tab-${sectionId}`).classList.add('active');
        document.getElementById(`${sectionId}-container`).classList.add('active');
        activeTabIndex = sectionKeys.indexOf(sectionId);
      }

      setInterval(() => {
        activeTabIndex = (activeTabIndex + 1) % sectionKeys.length;
        switchTab(sectionKeys[activeTabIndex]);
      }, 10000);

      function updateDateTime() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = now.toLocaleDateString('id-ID', options);
        document.getElementById('current-time').textContent = now.toLocaleTimeString('id-ID');
      }
      updateDateTime();
      setInterval(updateDateTime, 1000);

      async function fetchData() {
        try {
          const apiUrl = 'https://project.rsaisyiyahsitifatimah.com/api/ketersediaan-tt';
          const res = await fetch(apiUrl).then(r => r.json()).catch(() => null);

          let rawBeds = res;
          if (!rawBeds || rawBeds.length === 0) {
            console.warn('API kosong atau gagal, memuat simulasi data...');
            rawBeds = generateSampleData();
          }

          const igdBeds = rawBeds.filter(bed => isIgdUnit(bed));
          updateIgdPanel(igdBeds);

          const regularBeds = rawBeds.filter(bed => !isIgdUnit(bed) && !isVkUnit(bed));
          updateDashboard(regularBeds);
          calculateRealtimeBOR(regularBeds);

        } catch (error) {
          console.error('Gagal mengambil data ketersediaan TT:', error);
        }
      }

      function generateSampleData() {
        const bangsals = [...nursingStations.irna1, ...nursingStations.irna2, ...nursingStations.icu, ...nursingStations.bersalin, ...nursingStations.bayi];
        const data = [];
        const statuses = ['KOSONG', 'ISI', 'DIBOOKING']; 
        const kelas = ['Kelas 1', 'Kelas 2', 'Kelas 3', 'VIP'];

        bangsals.forEach(bangsal => {
          for (let i = 1; i <= 4; i++) {
            data.push({
              kd_kamar: `\({bangsal.substring(0, 3)}\){i}`,
              nm_bangsal: bangsal,
              kelas: kelas[Math.floor(Math.random() * kelas.length)],
              status: statuses[Math.floor(Math.random() * statuses.length)]
            });
          }
        });

        const sampleIgdCodes = ['K0000175','K0000176','K0000177','K0000178','K0000179','K0000182','K0000183','K0000184','K0000185'];
        sampleIgdCodes.forEach((code, idx) => {
          data.push({
            kd_kamar: code,
            nm_bangsal: 'IGD Rawat Inap',
            kelas: 'Kelas 3',
            status: idx === 2 ? 'ISI' : 'KOSONG'
          });
        });

        return data;
      }

      function updateDashboard(data) {
        const groupedData = { irna1: [], irna2: [], icu: [], bersalin: [], bayi: [], others: [] };
        
        data.forEach(bed => {
          if (nursingStations.irna1.includes(bed.nm_bangsal)) groupedData.irna1.push(bed);
          else if (nursingStations.irna2.includes(bed.nm_bangsal)) groupedData.irna2.push(bed);
          else if (nursingStations.icu.includes(bed.nm_bangsal)) groupedData.icu.push(bed);
          else if (nursingStations.bersalin.includes(bed.nm_bangsal)) groupedData.bersalin.push(bed);
          else if (nursingStations.bayi.includes(bed.nm_bangsal)) groupedData.bayi.push(bed);
          else groupedData.others.push(bed);
        });

        updateSection('irna1', groupedData.irna1);
        updateSection('irna2', groupedData.irna2);
        updateSection('icu', groupedData.icu);
        updateSection('bersalin', groupedData.bersalin);
        updateSection('bayi', groupedData.bayi);

        document.getElementById('irna1-available-icon').textContent = groupedData.irna1.filter(isAvailable).length;
        document.getElementById('irna2-available-icon').textContent = groupedData.irna2.filter(isAvailable).length;
        document.getElementById('icu-available-icon').textContent = groupedData.icu.filter(isAvailable).length;
        document.getElementById('bersalin-available-icon').textContent = groupedData.bersalin.filter(isAvailable).length;
        document.getElementById('bayi-available-icon').textContent = groupedData.bayi.filter(isAvailable).length;
      }

      function updateSection(sectionId, beds) {
        const container = document.getElementById(`${sectionId}-container`);
        const bedsByBangsal = {};
        beds.forEach(bed => {
          if (!bedsByBangsal[bed.nm_bangsal]) bedsByBangsal[bed.nm_bangsal] = [];
          bedsByBangsal[bed.nm_bangsal].push(bed);
        });
                    
        let html = '<div class="bangsal-grid">';
        for (const bangsal in bedsByBangsal) {
          const availCount = bedsByBangsal[bangsal].filter(isAvailable).length;
          const occuCount = bedsByBangsal[bangsal].filter(isOccupied).length;
          const currentClass = bedsByBangsal[bangsal][0]?.kelas || 'Kelas 3';
                              
          html += `
            <div class="bangsal-card">
              <div class="bangsal-header">
                <div>${bangsal}</div>
                <div class="bangsal-class">${currentClass}</div>
              </div>
              <div class="bangsal-body">
                <div class="stat-mini-box total">
                  <div class="val">${bedsByBangsal[bangsal].length}</div>
                  <div class="lbl">Total</div>
                </div>
                <div class="divider-line"></div>
                <div class="stat-mini-box avail">
                  <div class="val">${availCount}</div>
                  <div class="lbl">Tersedia</div>
                </div>
                <div class="divider-line"></div>
                <div class="stat-mini-box occu">
                  <div class="val">${occuCount}</div>
                  <div class="lbl">Terisi</div>
                </div>
              </div>
            </div>
          `;
        }
        html += '</div>';
        container.innerHTML = Object.keys(bedsByBangsal).length === 0 ? '<div class="empty-state">Tidak ada data</div>' : html;
      }

      function updateIgdPanel(igdBeds) {
        igdBeds.sort((a, b) => (a.kd_kamar || '').localeCompare(b.kd_kamar || ''));

        const igdBedAlias = {
          'K0000175': 'Bed 1',
          'K0000176': 'Bed 2',
          'K0000177': 'Bed 3',
          'K0000178': 'Bed 4',
          'K0000179': 'Bed 5',
          'K0000182': 'Bed 6',
          'K0000183': 'Bed 7',
          'K0000184': 'Bed 8',
          'K0000185': 'Bed 9'
        };

        const availCount = igdBeds.filter(isAvailable).length;
        const occuCount = igdBeds.filter(isOccupied).length;

        document.getElementById('igd-total-available').textContent = availCount;
        document.getElementById('igd-total-occupied').textContent = occuCount;

        const listContainer = document.getElementById('igd-list');
        if (igdBeds.length === 0) {
          listContainer.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1; font-size:1rem;">Tidak ada data bed IGD</div>';
          return;
        }

        let html = '';
        igdBeds.forEach((bed, index) => {
          const avail = isAvailable(bed);
          const cardClass = avail ? 'available' : 'occupied';
          const badgeLabel = avail ? 'Tersedia' : 'Terisi';
          
          const displayName = igdBedAlias[bed.kd_kamar] || ('Bed ' + (index + 1));
          const kelasLabel = bed.kelas || 'Kelas 3';

          html += '<div class="igd-bed-card ' + cardClass + '">' +
                    '<div class="bed-top-row">' +
                      '<span class="bed-class-sub">' + kelasLabel + '</span>' +
                      '<span class="bed-status-pill">' + badgeLabel + '</span>' +
                    '</div>' +
                    '<div class="bed-center-content">' +
                      '<i class="fa-solid fa-bed bed-main-icon"></i>' +
                      '<div class="bed-label-title">' + displayName + '</div>' +
                    '</div>' +
                  '</div>';
        });
        listContainer.innerHTML = html;
      }

      function calculateRealtimeBOR(beds) {
        if (!beds || beds.length === 0) {
          document.getElementById('bor-total').textContent = '0';
          document.getElementById('total-available').textContent = '0';
          document.getElementById('total-occupied').textContent = '0';
          return;
        }

        const totalAvailable = beds.filter(isAvailable).length;
        const totalOccupied = beds.filter(isOccupied).length;
        const totalBedOperasional = beds.length;

        const borRealtime = totalBedOperasional > 0 
          ? ((totalOccupied / totalBedOperasional) * 100).toFixed(1)
          : 0;

        document.getElementById('bor-total').textContent = borRealtime.endsWith('.0') 
          ? Math.round(borRealtime) 
          : borRealtime;
        document.getElementById('total-available').textContent = totalAvailable;
        document.getElementById('total-occupied').textContent = totalOccupied;
      }

      fetchData();
      setInterval(fetchData, 60000); 
    </script>
  </body>
</html>
